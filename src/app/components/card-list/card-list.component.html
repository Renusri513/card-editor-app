<div class="top-bar">
  <button class="top-add-btn" mat-raised-button color="accent" (click)="openAddDialog()">
    <mat-icon>add</mat-icon>
    Add New Card
  </button>
</div>

<div class="card-container">
  <mat-card *ngFor="let card of cards()" class="card">
    <mat-card-title>{{ card.title }}</mat-card-title>
    <mat-card-content>{{ card.description }}</mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="openEditDialog(card)">Edit</button>
      <button mat-raised-button color="warn" (click)="deleteCard(card.id)">Delete</button>
    </mat-card-actions>
  </mat-card>
</div>

<!-- Floating Add Button -->
<button class="add-btn" mat-fab color="accent" (click)="openAddDialog()">
  <mat-icon>add</mat-icon>
</button>
